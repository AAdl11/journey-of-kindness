name: Level 8 algorithm gates

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test-level8:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Level 8 reproducible gates
        run: node level8/tests.js
