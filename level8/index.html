<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   Level 8 UI — three-act adversarial search, per the approved blueprint.
   Rules & search live ONLY in engine.js / search_core.js. This file renders,
   narrates, and records learning evidence. No display text is defined here —
   everything player-visible comes from strings.js (L8_STRINGS).
   ═══════════════════════════════════════════════════════════════════════════ */
const ENGINE = L8_ENGINE, SEARCH = L8_SEARCH, STR = L8_STRINGS;
const TEST_MODE = /[?&]uitest=1/.test(location.search);
const REDUCED = TEST_MODE || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const MCTS_SEED_BASE = 20260823;         /* deterministic; per-decision seed = base + ply */
const ITER_CHOICES = [100, 500, 1500, 3000];

let lang = 'zh-Hant';
let phase = 'intro';                      /* intro → act1 → act1-tree → act2 → act3 → finish */
let G = null;                             /* current engine state */
let ply = 0;
let mctsIters = TEST_MODE ? 100 : 500;
let started = false, finished = false;
let pendingPredict = null;                /* set while awaiting the Act-1 prediction */
let lastMcts = null;                      /* latest rehearsal, for follow-tracking + Engineer table */
let treeData = null;                      /* built A1F tree (shared by acts 1 & 2) */
let abViz = null;                         /* alpha-beta visualization walk */
let revealTimer = null;
let prunePick = null;
let treeScale = 1;

/* ── i18n ──────────────────────────────────────────────────────────────── */
function t(key) { return (STR[lang] && STR[lang][key]) || STR.en[key] || key; }
function fmt(key) { let s = t(key); for (let i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(arguments[i]); return s; }
function setLang(next) {
  lang = next;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === next));
  document.querySelectorAll('[data-str]').forEach(el => { el.textContent = t(el.dataset.str); });
  document.getElementById('board').setAttribute('aria-label', t('a11yBoard'));
  document.getElementById('tree-scroll').setAttribute('aria-label', t('a11yTree'));
  if (G) renderHud();
}

/* ── analytics (Step 11) — instrumentation for a planned usability
      evaluation; stub-safe; never presented as research validation ──────── */
function track(name, params) {
  try { if (typeof gtag === 'function') gtag('event', name, Object.assign({ level: 8 }, params || {})); } catch (e) {}
}
function saveProgress(patch) {
  try {
    const p = JSON.parse(localStorage.getItem('jok_progress') || '{}');
    p.l8 = Object.assign(p.l8 || {}, patch);
    localStorage.setItem('jok_progress', JSON.stringify(p));
  } catch (e) {}
}

/* ── asset loader: real art (Step 9 contract filenames) replaces the
      semantic placeholders automatically once the files exist ───────────── */
function tryAsset(el) {
  if (!el || !el.dataset.asset) return;
  const src = el.dataset.asset;
  const img = new Image();
  img.onload = () => { el.style.backgroundImage = "url('" + src + "')"; el.classList.add('asset-loaded'); };
  img.src = src;
}

/* ── board rendering ───────────────────────────────────────────────────── */
function tileSize() {
  const n = G.n;
  const w = Math.min(document.documentElement.clientWidth - 28, 560);
  const h = Math.floor(window.innerHeight * (window.innerHeight < 620 ? 0.5 : 0.44));
  return Math.max(44, Math.floor(Math.min(w / n, h / n)));
}
function edgeParts(key) { const p = key.split('|'); return [p[0].split(',').map(Number), p[1].split(',').map(Number)]; }

function renderBoard() {
  const n = G.n, size = tileSize();
  const board = document.getElementById('board');
  board.style.setProperty('--tile', size + 'px');
  board.style.gridTemplateColumns = 'repeat(' + n + ', ' + size + 'px)';
  board.innerHTML = '';
  const deadA1F = { '0,0': 1, '1,0': 1, '2,0': 1, '2,1': 1 };
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.id = 'tile-' + r + '-' + c;
    if (G.act === 'A1F' && deadA1F[r + ',' + c]) tile.classList.add('dead');
    const hh = ENGINE.householdAt(G, r, c);
    if (hh) {
      const house = document.createElement('div');
      house.className = 'house' + (hh.served ? ' served' : '') + (hh.delay > 0 ? ' delayed' : '');
      house.setAttribute('aria-label', fmt('householdFmt', hh.id) + ' · ' + fmt('needBadgeFmt', hh.need));
      house.innerHTML = '<span class="glyph">🏠</span><span class="need-badge n' + hh.need + '">' + hh.need + '</span>';
      house.title = hh.delay > 0 ? t('delayActive') : '';
      tile.appendChild(house);
    }
    tile.addEventListener('click', () => onTileTap(r, c));
    board.appendChild(tile);
  }
  /* closed edges */
  const bars = [];
  G.preClosed.forEach(k => bars.push([k, true]));
  Object.keys(G.closedTemp).forEach(k => bars.push([k, false]));
  for (const pair of bars) {
    const key = pair[0], pre = pair[1];
    const bar = document.createElement('div');
    bar.className = 'edge-bar' + (pre ? ' pre' : '');
    bar.dataset.edge = key;
    positionEdgeBar(bar, key, size);
    if (!pre) bar.title = t('roadClosedTile');
    board.appendChild(bar);
  }
  /* pawn */
  const pawn = document.createElement('div');
  pawn.className = 'pawn'; pawn.id = 'pawn';
  pawn.textContent = '🙋';
  pawn.setAttribute('aria-label', t('volunteer'));
  pawn.style.left = (G.pos[1] * size) + 'px';
  pawn.style.top = (G.pos[0] * size) + 'px';
  board.appendChild(pawn);
  document.getElementById('fog-veil').classList.toggle('on', G.fog > 0);
}
function positionEdgeBar(bar, key, size) {
  const ep = edgeParts(key), a = ep[0], b = ep[1];
  const th = Math.max(8, Math.floor(size * .14));
  if (a[0] === b[0]) {   /* horizontally adjacent tiles → vertical bar */
    bar.style.width = th + 'px'; bar.style.height = Math.floor(size * .8) + 'px';
    bar.style.left = (Math.max(a[1], b[1]) * size - th / 2) + 'px';
    bar.style.top = (a[0] * size + size * .1) + 'px';
  } else {               /* vertically adjacent tiles → horizontal bar */
    bar.style.height = th + 'px'; bar.style.width = Math.floor(size * .8) + 'px';
    bar.style.top = (Math.max(a[0], b[0]) * size - th / 2) + 'px';
    bar.style.left = (a[1] * size + size * .1) + 'px';
  }
}

function renderHud() {
  const actKey = phase === 'act3' ? 'act3Name' : phase === 'act2' ? 'act2Name' : 'act1Name';
  document.getElementById('hud-act').textContent = t(actKey);
  document.getElementById('hud-time').textContent = fmt('timeFmt', G.t, G.T);
  const served = G.households.filter(h => h.served).length;
  document.getElementById('hud-served').textContent = fmt('servedFmt', served, G.households.length);
  document.getElementById('fog-veil').classList.toggle('on', G.fog > 0);
}

/* ── MAX turn ──────────────────────────────────────────────────────────── */
function beginMaxTurn() {
  if (ENGINE.isTerminal(G)) return onTerminal();
  renderBoard(); renderHud();
  const legal = ENGINE.legalMoves(G);
  const moves = legal.filter(a => a.type === 'MOVE');
  const canServe = legal.some(a => a.type === 'SERVE');
  const dirVec = { N: [-1, 0], E: [0, 1], S: [1, 0], W: [0, -1] };
  for (const mv of moves) {
    const d = dirVec[mv.dir];
    const el = document.getElementById('tile-' + (G.pos[0] + d[0]) + '-' + (G.pos[1] + d[1]));
    if (el) { el.classList.add('tap-target'); el.dataset.dir = mv.dir; }
  }
  const bar = document.getElementById('action-bar');
  bar.innerHTML = '';
  if (canServe) {
    const b = document.createElement('button');
    b.className = 'btn-primary'; b.id = 'btn-serve';
    b.textContent = t('serveHere');
    b.onclick = () => playerAction({ type: 'SERVE' });
    bar.appendChild(b);
  }
  const w = document.createElement('button');
  w.className = 'btn-secondary'; w.id = 'btn-wait';
  w.textContent = t('wait');
  w.onclick = () => playerAction({ type: 'WAIT' });
  bar.appendChild(w);
  narrate(moves.length === 0 && canServe ? t('urgentRule') : (G.fog > 0 ? t('fogActive') : t('yourTurn')));
  if (phase === 'act3') rehearse();          /* the act's core teaching loop */
}
function onTileTap(r, c) {
  if (pendingPredict) return;
  const el = document.getElementById('tile-' + r + '-' + c);
  if (!el) return;
  if (!el.classList.contains('tap-target')) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); return; }
  playerAction({ type: 'MOVE', dir: el.dataset.dir });
}
function playerAction(action) {
  if (pendingPredict) return;
  if (phase === 'act3' && lastMcts) {
    const best = lastMcts.rootActions.reduce((a, b) => (b.visits > a.visits ? b : a));
    track('l8_rehearsal_follow', {
      followed: JSON.stringify(best.action) === JSON.stringify(action),
      bestVisits: best.visits, iters: lastMcts.iterations, ply: ply,
    });
    lastMcts = null;
  }
  clearGhosts();
  G = ENGINE.apply(G, action);
  ply++;
  renderBoard(); renderHud();
  if (ENGINE.isTerminal(G)) return onTerminal();
  beginMinTurn();
}

}
function askPrediction(legal) {
  narrate(t('predictPrompt'));
  pendingPredict = { options: legal };
  const size = tileSize();
  legal.filter(a => a.type === 'ROAD_CLOSE').forEach(a => {

function resolvePrediction(predicted) {
  pendingPredict = null;
  document.getElementById('predict-chips').innerHTML = '';
  const pm = document.getElementById('predict-edge'); if (pm) pm.remove();
  engineReply(predicted);
}
function engineReply(predicted) {
  narrate(t('engineTurn'));
  setTimeout(() => {
    const action = phase === 'act1'
      ? SEARCH.minimax(G).action
      : SEARCH.mcts(G, mctsIters, MCTS_SEED_BASE + ply).action;
    if (predicted !== undefined) {
      const match = JSON.stringify(predicted) === JSON.stringify(action);
      track('l8_predict_engine', { predicted: predicted.type, actual: action.type, match: match, ply: ply });
      narrate(fmt(match ? 'predictHitFmt' : 'predictMissFmt', engineMoveName(action)));
    } else {
      narrate(fmt('engineDidFmt', engineMoveName(action)));
    }
    G = ENGINE.apply(G, action);
    ply++;
    document.getElementById('totem').classList.remove('acting');

  }, REDUCED ? 20 : 600);
}
function engineMoveName(a) {

}

/* ── Act 1 tree reveal ─────────────────────────────────────────────────── */
function buildTree() {
  if (treeData) return treeData;
  const root = { state: ENGINE.initState('A1F'), action: null, children: [], depth: 0 };
  let count = 0;
  (function grow(node) {
    count++;
    if (ENGINE.isTerminal(node.state)) { node.leaf = true; return; }
    for (const a of ENGINE.legalMoves(node.state)) {
      const child = { state: ENGINE.apply(node.state, a), action: a, children: [], depth: node.depth + 1 };
      node.children.push(child);
      grow(child);
    }
  })(root);
  let leafX = 0;
  (function place(node) {
    if (!node.children.length) { node.x = leafX++; return; }
    node.children.forEach(place);
    node.x = (node.children[0].x + node.children[node.children.length - 1].x) / 2;
  })(root);
  const mm = SEARCH.minimax(root.state);
  let cur = root; cur.pv = true;
  for (const a of mm.pv) {
    cur = cur.children.find(ch => JSON.stringify(ch.action) === JSON.stringify(a));
    if (!cur) break;
    cur.pv = true;
  }
  treeData = { root: root, count: count, leaves: leafX, mm: mm };
  return treeData;
}
function actionGlyph(a) {
  if (!a) return '🌳';
  if (a.type === 'MOVE') return { N: '↑', E: '→', S: '↓', W: '←' }[a.dir];
  return { SERVE: '🍚', WAIT: '⏸', ROAD_CLOSE: '🚧', SUPPLY_DELAY: '⏳', FOG: '🌫', PASS: '⏭' }[a.type];
}
function treeZoom(f) {
  treeScale = Math.max(.4, Math.min(2.5, treeScale * f));
  document.getElementById('tree-svg-wrap').style.transform = 'scale(' + treeScale + ')';
  document.getElementById('tree-svg-wrap').style.width = 'fit-content';
}
function renderTreeSvg(marks) {
  const td = buildTree();
  const DX = 26, DY = 66, R = 9, PADX = 20, PADY = 26;
  const W = td.leaves * DX + PADX * 2, H = 6 * DY + PADY * 2;
  const parts = [];
  (function draw(node, parent) {
    const x = PADX + node.x * DX, y = PADY + node.depth * DY;
    node._px = x; node._py = y;
    if (parent) {
      const cls = node.pv && parent.pv ? 'stroke="#fbbf24" stroke-width="3.5"' : 'stroke="rgba(148,163,184,.5)" stroke-width="1"';
      parts.push('<line x1="' + parent._px + '" y1="' + parent._py + '" x2="' + x + '" y2="' + y + '" ' + cls + '/>');
    }
    node.children.forEach(ch => draw(ch, node));
    const isMax = node.state.toMove === 'MAX' || node.leaf;
    const mark = marks && marks.get(node);
    let fill = node.leaf ? '#475569' : (isMax ? '#38bdf8' : '#94a3b8');
    let extra = '';
    if (node.pv) { fill = '#fbbf24'; extra = ' stroke="#fff7ed" stroke-width="2"'; }
    if (mark === 'pruned') { fill = '#1e293b'; extra = ' opacity=".4"'; }
    parts.push('<circle cx="' + x + '" cy="' + y + '" r="' + R + '" fill="' + fill + '"' + extra + '/>');
    if (mark === 'cut') parts.push('<text x="' + (x + 9) + '" y="' + (y - 9) + '" font-size="13">✂️</text>');
    if (node.action) parts.push('<text x="' + x + '" y="' + (y + 3.5) + '" font-size="9" text-anchor="middle" fill="#0f172a" font-weight="700">' + actionGlyph(node.action) + '</text>');
  })(td.root, null);
  document.getElementById('tree-svg-wrap').innerHTML =
    '<svg id="tree-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + parts.join('') + '</svg>';
}
function showAct1Tree() {

/* ── Act 2: alpha-beta pruning on the same tree ────────────────────────── */
function computeAbViz() {
  if (abViz) return abViz;
  const td = buildTree();
  const order = [], marks = new Map();
  let explored = 0;
  (function visit(node, alpha, beta) {
    explored++; order.push(node);
    if (node.leaf) return ENGINE.utility(node.state);
    const isMax = node.state.toMove === 'MAX';
    let best = null;
    for (let i = 0; i < node.children.length; i++) {
      const v = visit(node.children[i], alpha, beta);
      if (best === null || (isMax ? v > best : v < best)) best = v;
      if (isMax) alpha = Math.max(alpha, best); else beta = Math.min(beta, best);
      if (beta < alpha) {                     /* mirrors search_core: strict cutoff */
        for (let j = i + 1; j < node.children.length; j++)
          (function markAll(x) { marks.set(x, 'pruned'); x.children.forEach(markAll); })(node.children[j]);
        marks.set(node, 'cut');
        break;
      }
    }
    return best;
  })(td.root, -Infinity, Infinity);
  const natural = SEARCH.alphabeta(ENGINE.initState('A1F'), -Infinity, Infinity, { order: 'natural' });
  const bestFirst = SEARCH.alphabeta(ENGINE.initState('A1F'), -Infinity, Infinity, { order: 'best-first' });
  abViz = { order: order, marks: marks, explored: explored, natural: natural, bestFirst: bestFirst };
  return abViz;
}
function startAct2() {
  phase = 'act2';
  const td = buildTree();
  showScreen('screen-tree');
  document.getElementById('tree-hud-act').textContent = t('act2Name');
  document.getElementById('tree-narrator').textContent = t('act2Brief') + ' ' + t('prunePrompt');
  document.getElementById('tree-counter').textContent = fmt('exploredFmt', 0);
  renderTreeSvg(null);
  prunePick = null;
  const heads = document.getElementById('branch-heads');
  heads.innerHTML = '';
  td.root.children.forEach(function (child, i) {
    const b = document.createElement('button');
    b.className = 'branch-head'; b.id = 'branch-' + i;
    b.textContent = actionGlyph(child.action) + ' ' + (child.action.type === 'MOVE' ? child.action.dir : child.action.type);
    b.onclick = function () {
      prunePick = i;
      heads.querySelectorAll('.branch-head').forEach((x, j) => x.classList.toggle('picked', j === i));
      runAct2Reveal();
    };
    heads.appendChild(b);
  });
  document.getElementById('tree-actions').innerHTML = '';
}
function runAct2Reveal() {
  const viz = computeAbViz();
  const td = buildTree();
  const picked = td.root.children[prunePick];
  let wasPruned = false;
  (function scan(x) { if (viz.marks.get(x) === 'pruned') wasPruned = true; x.children.forEach(scan); })(picked);
  track('l8_prune_predict', { edge: actionGlyph(picked.action) + (picked.action.dir || picked.action.type), wasPruned: wasPruned });
  document.getElementById('branch-heads').innerHTML = '';
  document.getElementById('tree-narrator').textContent = wasPruned ? t('pruneHit') : t('pruneMiss');
  const counterEl = document.getElementById('tree-counter');
  const finish = function () {
    renderTreeSvg(viz.marks);
    counterEl.textContent = fmt('exploredFmt', viz.natural.nodesExplored) + ' · ' + fmt('prunedFmt', td.count - viz.explored, td.count);
    showOrderingToggle();
  };
  if (REDUCED) { finish(); return; }
  let i = 0;
  revealTimer = setInterval(function () {
    i = Math.min(i + 4, viz.order.length);
    counterEl.textContent = fmt('exploredFmt', i);
    if (i >= viz.order.length) { clearInterval(revealTimer); revealTimer = null; finish(); }
  }, 60);
}
function skipReveal() {
  if (revealTimer) { clearInterval(revealTimer); revealTimer = null; }
  if (phase === 'act2' && prunePick !== null) {
    const viz = computeAbViz(), td = buildTree();
    renderTreeSvg(viz.marks);
    document.getElementById('tree-counter').textContent = fmt('exploredFmt', viz.natural.nodesExplored) + ' · ' + fmt('prunedFmt', td.count - viz.explored, td.count);
    showOrderingToggle();
  }
}
function showOrderingToggle() {
  const viz = computeAbViz();
  const bar = document.getElementById('tree-actions');
  if (document.getElementById('btn-to-act3')) return;
  bar.innerHTML = '';
  const lesson = document.createElement('p');
  lesson.className = 'narrator'; lesson.id = 'ordering-lesson';
  lesson.textContent = fmt('orderLessonFmt', viz.natural.nodesExplored, viz.bestFirst.nodesExplored);
  const tg = document.createElement('button');
  tg.className = 'btn-secondary'; tg.id = 'btn-order-toggle';
  let mode = 'natural';
  const label = function () { return t('orderToggle') + ': ' + (mode === 'natural' ? t('orderNatural') : t('orderBest')) + ' · ' + fmt('exploredFmt', (mode === 'natural' ? viz.natural : viz.bestFirst).nodesExplored); };
  tg.textContent = label();
  tg.onclick = function () { mode = mode === 'natural' ? 'best' : 'natural'; tg.textContent = label(); };
  const next = document.createElement('button');
  next.className = 'btn-primary'; next.id = 'btn-to-act3';
  next.textContent = t('toAct3');
  next.onclick = startAct3;
  bar.appendChild(lesson); bar.appendChild(tg); bar.appendChild(next);
  updateEngineerCounts();
}

/* ── Act 3 ghost rehearsals ────────────────────────────────────────────── */
function clearGhosts() { document.querySelectorAll('.ghost').forEach(g => g.remove()); }
function rehearse() {
  if (ENGINE.isTerminal(G) || G.toMove !== 'MAX') return;
  narrate(fmt('rehearsingFmt', mctsIters));
  setTimeout(function () {
    lastMcts = SEARCH.mcts(G, mctsIters, MCTS_SEED_BASE + ply);
    drawGhosts(lastMcts);
    updateEngineerTable(lastMcts);
    const best = lastMcts.rootActions.reduce((a, b) => (b.visits > a.visits ? b : a));
    narrate(fmt('ghostLessonFmt', best.visits) + ' — ' + t('chooseOwn'));
    const bar = document.getElementById('action-bar');
    if (!document.getElementById('btn-follow')) {
      const f = document.createElement('button');
      f.className = 'btn-ghosty'; f.id = 'btn-follow';
      f.textContent = t('followBest');
      f.onclick = function () { playerAction(best.action); };
      bar.insertBefore(f, bar.firstChild);
    }
  }, REDUCED ? 10 : 350);
}
function drawGhosts(result) {
  clearGhosts();
  const size = tileSize();
  const maxV = Math.max.apply(null, result.rootActions.map(a => a.visits).concat([1]));
  const board = document.getElementById('board');
  const dirVec = { N: [-1, 0], E: [0, 1], S: [1, 0], W: [0, -1] };
  result.rootActions.forEach(function (ra, i) {
    if (!ra.visits) return;
    const op = 0.2 + 0.7 * (ra.visits / maxV);
    const g = document.createElement('div');
    g.className = 'ghost';
    g.textContent = '👻';
    g.style.setProperty('--ghost-op', op.toFixed(2));
    let tr = G.pos[0], tc = G.pos[1];
    if (ra.action.type === 'MOVE') {
      const d = dirVec[ra.action.dir];
      tr += d[0]; tc += d[1];
      g.style.setProperty('--gx', (d[1] * size * .8) + 'px');
      g.style.setProperty('--gy', (d[0] * size * .8) + 'px');
    }
    g.style.left = (G.pos[1] * size) + 'px';
    g.style.top = (G.pos[0] * size) + 'px';
    g.style.animationDelay = (i * .12) + 's';
    if (REDUCED) { g.style.animation = 'none'; g.style.opacity = op.toFixed(2); g.style.left = (tc * size) + 'px'; g.style.top = (tr * size) + 'px'; }
    board.appendChild(g);
  });
}

/* ── Engineer view ─────────────────────────────────────────────────────── */
function initEngineer() {
  const holder = document.getElementById('iter-btns');
  ITER_CHOICES.forEach(function (n) {
    const b = document.createElement('button');
    b.textContent = n; b.dataset.iters = n;
    if (n === mctsIters) b.className = 'active';
    b.onclick = function () {
      mctsIters = n;
      holder.querySelectorAll('button').forEach(x => x.classList.toggle('active', +x.dataset.iters === n));
    };
    holder.appendChild(b);
  });
  document.getElementById('eng-seed').textContent = MCTS_SEED_BASE + ' + ply';
  updateEngineerCounts();
}
function updateEngineerCounts() {
  const td = treeData, viz = abViz;
  document.getElementById('eng-counts').textContent =
    fmt('engineerCounts', td ? td.count : '—', viz ? viz.natural.nodesExplored : '—', viz ? viz.bestFirst.nodesExplored : '—');
}
function updateEngineerTable(result) {
  const tb = document.querySelector('#eng-table tbody');
  tb.innerHTML = '';
  result.rootActions.slice().sort((a, b) => b.visits - a.visits).slice(0, 8).forEach(function (ra) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="mono">' + actionGlyph(ra.action) + ' ' + (ra.action.dir || ra.action.type) + '</td><td>' + ra.visits + '</td><td>' + (ra.mean === null ? '—' : ra.mean.toFixed(2)) + '</td>';
    tb.appendChild(tr);
  });
  updateEngineerCounts();
}

/* ── boot ──────────────────────────────────────────────────────────────── */
window.addEventListener('beforeunload', function () {
  if (started && !finished) track('level_abandon', { phase: phase, ply: ply });
});
document.addEventListener('DOMContentLoaded', function () {
  setLang('zh-Hant');
  initEngineer();
  document.querySelectorAll('[data-asset]').forEach(tryAsset);
});
</script>
