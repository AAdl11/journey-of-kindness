<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#143f46">
    <title>Kindness Algorithm Passport | Journey of Kindness</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BKBPRQQQ1Y"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>
    <header class="topbar">
        <a class="brand" href="../" aria-label="Journey of Kindness home">
            <span class="brand-mark">善</span>
            <span>Journey of Kindness</span>
        </a>
        <nav class="languages" aria-label="Language">
            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="es">ES</button>
        </nav>
    </header>

    <main class="page-shell">
        <section class="passport" aria-labelledby="page-title">
            <div class="passport-cover">
                <div class="passport-seal" aria-hidden="true"><span>✦</span></div>
                <div>
                    <p class="eyebrow" data-i18n="eyebrow"></p>
                    <h1 id="page-title" data-i18n="title"></h1>
                    <p class="intro" data-i18n="intro"></p>
                </div>
            </div>

            <div class="level-strip">
                <label for="level-select" data-i18n="levelLabel"></label>
                <div class="select-wrap">
                    <span id="level-stamp" class="level-stamp" aria-hidden="true">?</span>
                    <select id="level-select" required></select>
                </div>
            </div>

            <section id="level-welcome" class="level-welcome" hidden>
                <div class="algorithm-orbit" aria-hidden="true">
                    <span class="orbit-dot"></span><span class="orbit-dot"></span><span class="orbit-dot"></span>
                    <b id="algorithm-symbol">AI</b>
                </div>
                <div>
                    <p id="level-kicker" class="level-kicker"></p>
                    <h2 id="level-title"></h2>
                    <p id="level-story"></p>
                </div>
            </section>

            <form id="passport-form" action="https://docs.google.com/forms/d/e/1FAIpQLSessk0TDC6wJCF6C3baLOP-U0rfnZzFftKEG-rFhDkpoarnHA/formResponse" method="post" target="feedbackTransport" accept-charset="UTF-8" hidden>
                <input id="backend-level" type="hidden" name="entry.755510498">
                <input id="backend-language" type="hidden" name="entry.1465065171">
                <input type="hidden" name="fvv" value="1">
                <input type="hidden" name="pageHistory" value="0">

                <fieldset class="question rating-question">
                    <legend><span class="question-number">1</span><span data-i18n="clarityQuestion"></span></legend>
                    <p class="question-help" data-i18n="clarityHelp"></p>
                    <div class="rating" data-rating="clarity"></div>
                </fieldset>

                <fieldset class="question rating-question">
                    <legend><span class="question-number">2</span><span data-i18n="difficultyQuestion"></span></legend>
                    <p class="question-help" data-i18n="difficultyHelp"></p>
                    <div class="rating" data-rating="difficulty"></div>
                </fieldset>

                <fieldset class="question">
                    <legend><span class="question-number">3</span><span data-i18n="helpfulQuestion"></span></legend>
                    <div id="helpful-options" class="choice-grid helpful-grid"></div>
                </fieldset>

                <fieldset class="question algorithm-question">
                    <legend><span class="question-number">4</span><span id="algorithm-question"></span></legend>
                    <p class="question-help" data-i18n="noQuiz"></p>
                    <div id="algorithm-options" class="choice-grid"></div>
                </fieldset>

                <label class="question text-question">
                    <span class="legend-line"><span class="question-number">5</span><span data-i18n="stuckQuestion"></span></span>
                    <span class="optional" data-i18n="optional"></span>
                    <textarea name="entry.605863183" rows="3" maxlength="1000" data-placeholder="stuckPlaceholder"></textarea>
                </label>

                <label class="question text-question">
                    <span class="legend-line"><span class="question-number">6</span><span data-i18n="improveQuestion"></span></span>
                    <span class="optional" data-i18n="optional"></span>
                    <textarea name="entry.1992198983" rows="3" maxlength="1000" data-placeholder="improvePlaceholder"></textarea>
                </label>

                <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
                <div class="actions">
                    <button id="submit-button" class="primary" type="submit"><span aria-hidden="true">💛</span><span data-i18n="submit"></span></button>
                    <a id="return-link" class="secondary" href="../"><span data-i18n="notNow"></span></a>
                </div>
                <p class="privacy-note" data-i18n="privacy"></p>
            </form>

            <section id="success-panel" class="success" hidden aria-live="polite">
                <div class="success-stamp" aria-hidden="true">✓</div>
                <h2 data-i18n="thanksTitle"></h2>
                <p data-i18n="thanksBody"></p>
                <div class="actions">
                    <a id="success-return" class="primary" href="../"><span data-i18n="returnLevel"></span></a>
                    <button id="another-response" class="secondary" type="button" data-i18n="another"></button>
                </div>
            </section>
        </section>
    </main>

    <iframe name="feedbackTransport" id="feedback-transport" title="Feedback submission" hidden></iframe>
    <script src="app.js"></script>
